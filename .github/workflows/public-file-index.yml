name: Generate publicFileIndex

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**"
      - "scripts/generate-public-file-index.mjs"
      - "scripts/update-plugin-dependencies.mjs"
      - ".github/workflows/public-file-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency scanners
        run: |
          npm install --no-save --no-package-lock madge
          python -m pip install --upgrade pipreqs
      - name: Detect plugin dependencies
        run: node scripts/update-plugin-dependencies.mjs
      - name: Generate publicFileIndex
        run: node scripts/generate-public-file-index.mjs
      - name: Commit plugin metadata
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update plugin dependency metadata"
          file_pattern: plugins/*.js plugins/*.py publicFileIndex.json
